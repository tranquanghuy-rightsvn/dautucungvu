<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khóa học đầu tư chứng khoán | Đầu tư cùng Vũ</title>
  <meta name="description" content="Lộ trình 5 cấp độ: từ người mới bắt đầu đến tự xây dựng danh mục đầu tư.">
  <meta name="theme-color" content="#06142e">
  <link rel="icon" href="../assets/img/vu-128.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/core.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/pages/courses.js" defer></script>
</head>
<body data-page="courses">
  <a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
  <header data-site-header class="site-header"></header>

  <main id="main">
    <section class="page-banner page-banner--slim">
      <div class="container">
        <div>
          <h1>Khóa học</h1>
          <p>Bài giảng video từ cơ bản đến thực chiến. Có khóa miễn phí để bắt đầu ngay.</p>
        </div>
      </div>
    </section>

    <div class="offer-strip">
      <div class="container">
        <span data-icon="gift"></span>
        <p><b data-offer-title>Mở tài khoản hoặc chuyển ID về ĐẦU TƯ CÙNG VŨ</b> <span data-offer-text>với số vốn từ 50 triệu đồng – Miễn phí toàn bộ khóa học &amp; tin tức độc quyền!</span></p>
        <a class="btn btn--gold btn--sm" href="../mo-tai-khoan/">Mở tài khoản / chuyển ID</a>
      </div>
    </div>

    <section class="section" id="khoa-hoc">
      <div class="container course-layout">
        <aside class="panel course-side" aria-label="Danh sách khóa học">
          <div class="tabs course-filter" role="tablist" aria-label="Lọc khóa học" data-course-filter>
            <button class="tab" role="tab" aria-selected="true" data-value="all">Tất cả</button>
            <button class="tab" role="tab" aria-selected="false" data-value="free">Miễn phí</button>
            <button class="tab" role="tab" aria-selected="false" data-value="paid">Có phí</button>
            <button class="tab" role="tab" aria-selected="false" data-value="mine">Của tôi</button>
          </div>
          <div class="search-box">
            <span data-icon="search"></span>
            <label class="sr-only" for="course-search">Tìm khóa học</label>
            <input class="input" id="course-search" type="search" placeholder="Tìm khóa học..." autocomplete="off">
          </div>
          <ul class="course-picker" data-course-list></ul>
        </aside>

        <article class="course-detail" id="chi-tiet" data-course-detail aria-live="polite"></article>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
</body>
</html>
