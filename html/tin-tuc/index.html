<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tin tức chứng khoán theo mã cổ phiếu | Đầu tư cùng Vũ</title>
  <meta name="description" content="Tin tức, phân tích kỹ thuật và phân tích cơ bản gắn với từng mã cổ phiếu bạn quan tâm.">
  <meta name="theme-color" content="#06142e">
  <link rel="icon" href="../assets/img/vu-128.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/core.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/pages/news.js" defer></script>
</head>
<body data-page="news">
  <a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
  <header data-site-header class="site-header"></header>
  <div data-market-strip class="market-strip"></div>

  <main id="main">
    <section class="page-banner page-banner--news">
      <div class="banner-art" data-banner-art></div>
      <div class="container news-banner">
        <div>
          <h1>Tin tức chứng khoán</h1>
          <p>Nhận định thị trường mỗi sáng, tin doanh nghiệp, cổ tức, BCTC và dòng tiền khối ngoại, sắp xếp mới nhất lên đầu.</p>
        </div>
        <div class="news-banner-search search-box" id="tim-ma">
          <span data-icon="search"></span>
          <label class="sr-only" for="news-search">Tìm tin theo mã cổ phiếu hoặc chủ đề</label>
          <input class="input" id="news-search" type="search" placeholder="Tìm mã CP, cổ tức, BCTC, khối ngoại..." autocomplete="off"
            role="combobox" aria-expanded="false" aria-controls="news-suggest" aria-autocomplete="list">
          <div class="suggest" id="news-suggest" role="listbox" aria-label="Gợi ý tìm kiếm" hidden></div>
        </div>
        <div class="news-topics" role="group" aria-label="Lọc theo chủ đề" data-topics></div>
      </div>
    </section>

    <section class="section">
      <div class="container news-layout">
        <aside class="panel ticker-side" aria-label="Tin theo mã cổ phiếu">
          <h2>Tin theo mã cổ phiếu</h2>
          <ul class="ticker-list" data-ticker-list></ul>
        </aside>

        <div>
          <div class="news-head">
            <div>
              <h2 data-news-title>Tất cả tin tức</h2>
              <p class="news-count" data-news-count></p>
            </div>
            <button class="btn btn--outline btn--sm" type="button" aria-pressed="false" data-follow hidden></button>
          </div>
          <div class="active-filters" data-active-filters></div>
          <div class="panel quote-card" data-quote hidden></div>
          <div class="panel" style="padding:8px">
            <div class="news-list" data-news-list aria-live="polite"></div>
            <div class="load-more" data-load-more-wrap>
              <button class="btn btn--outline" type="button" data-load-more>Xem thêm bài viết</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
</body>
</html>
